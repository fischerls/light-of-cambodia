name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["**"]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=light-of-cambodia --branch=${{ github.ref_name }} --commit-dirty=true

      - name: Preview URL note
        if: github.ref_name != 'main'
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/_' '--' | tr '[:upper:]' '[:lower:]')
          echo "Preview: https://${SAFE_BRANCH}.light-of-cambodia.pages.dev" >> "$GITHUB_STEP_SUMMARY"
